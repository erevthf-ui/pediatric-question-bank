<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>儿科刷题档案</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f3f7fa;color:#25364a;padding:3rem;line-height:1.8}a{color:#235fcb}</style>
</head>
<body>
<p>正在加载儿科题库与图文解析……</p>
<script>
fetch('./bank.html').then(response => {
  if (!response.ok) throw new Error('无法加载题库文件：HTTP ' + response.status);
  return response.text();
}).then(html => {
  const enhanced = html.replace(/<\/head>/i, '<script defer src="./visuals.js"></' + 'script></head>')
    .replace(/<\/body>/i, '<script src="./q6.js"></' + 'script><script src="./q7-q11.js"></' + 'script><script src="./question-loader.js"></' + 'script></body>');
  document.open();
  document.write(enhanced);
  document.close();
}).catch(error => {
  document.body.innerHTML = '<h1>网页加载暂时失败</h1><p>请刷新重试，或<a href="./bank.html">打开原版题库（Q1–Q5）</a>。</p>';
  console.error(error);
});
</script>
</body>
</html>
